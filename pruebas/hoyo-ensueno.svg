<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
  <!-- © 2026 Carlos Acedo Domínguez · Ilustración original para acgolf: un par 3 de ensueño -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FB6E3"/><stop offset="0.6" stop-color="#CFE6F2"/><stop offset="1" stop-color="#F3EBD2"/>
    </linearGradient>
    <linearGradient id="lejos" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E8F6A"/><stop offset="1" stop-color="#3F7352"/>
    </linearGradient>
    <linearGradient id="calle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CCB5E"/><stop offset="1" stop-color="#4E9A3A"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FCB55"/><stop offset="1" stop-color="#A6DE6E"/>
    </linearGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E7FA6"/><stop offset="1" stop-color="#1F4F73"/>
    </linearGradient>
    <linearGradient id="primerPlano" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C9A3C"/><stop offset="1" stop-color="#2E6B2A"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.78" cy="0.12" r="0.5">
      <stop offset="0" stop-color="#FFF6D8" stop-opacity="0.9"/><stop offset="1" stop-color="#FFF6D8" stop-opacity="0"/>
    </radialGradient>
    <g id="pino">
      <rect x="-5" y="-10" width="10" height="150" fill="#5B3A24"/>
      <path d="M0 -150 L42 -40 L22 -40 L56 30 L-56 30 L-22 -40 L-42 -40 Z" fill="#2F5E3B"/>
      <path d="M0 -150 L20 -96 L-6 -96 Z M0 -60 L34 0 L4 0 Z" fill="#3E7A4B" opacity="0.8"/>
    </g>
    <g id="arbusto">
      <circle cx="0" cy="0" r="26"/><circle cx="24" cy="6" r="22"/><circle cx="-24" cy="8" r="20"/><circle cx="6" cy="-14" r="18"/>
    </g>
  </defs>

  <!-- cielo y luz -->
  <rect width="1200" height="700" fill="url(#cielo)"/>
  <rect width="1200" height="700" fill="url(#sol)"/>
  <g fill="#FFFFFF" opacity="0.75">
    <ellipse cx="220" cy="90" rx="90" ry="18"/><ellipse cx="290" cy="80" rx="60" ry="16"/>
    <ellipse cx="700" cy="60" rx="110" ry="16"/><ellipse cx="780" cy="52" rx="60" ry="14"/>
  </g>

  <!-- colinas y bosque lejano -->
  <path d="M0 300 C160 250 300 270 430 245 C600 215 760 250 900 230 C1030 212 1120 240 1200 228 L1200 560 L0 560 Z" fill="url(#lejos)"/>
  <g fill="#4C7F5C" opacity="0.9">
    <path d="M0 330 l18 -60 l18 60 Z M40 336 l22 -74 l22 74 Z M90 330 l16 -54 l16 54 Z M980 300 l20 -66 l20 66 Z M1030 306 l24 -80 l24 80 Z M1086 300 l18 -60 l18 60 Z M1130 304 l22 -72 l22 72 Z"/>
  </g>

  <!-- calle al fondo -->
  <path d="M540 300 C620 294 700 296 760 302 C800 330 840 360 870 400 C760 392 600 392 440 400 C470 360 505 330 540 300 Z" fill="#9BD06A" opacity="0.8"/>

  <!-- pinos altos a los lados -->
  <use href="#pino" transform="translate(60 330) scale(1.6)"/>
  <use href="#pino" transform="translate(150 360) scale(1.25)"/>
  <use href="#pino" transform="translate(250 345) scale(1.05)"/>
  <use href="#pino" transform="translate(1150 330) scale(1.7)"/>
  <use href="#pino" transform="translate(1050 355) scale(1.3)"/>
  <use href="#pino" transform="translate(960 350) scale(1)"/>
  <use href="#pino" transform="translate(880 340) scale(0.8)"/>

  <!-- ladera detrás del green, con flores -->
  <path d="M0 450 C200 400 420 392 700 392 C900 394 1060 410 1200 440 L1200 560 L0 560 Z" fill="#3F7A3A"/>
  <g fill="#E46A9A"><use href="#arbusto" transform="translate(150 445) scale(0.9)"/><use href="#arbusto" transform="translate(1130 448) scale(0.9)"/><use href="#arbusto" transform="translate(380 420) scale(0.9)"/><use href="#arbusto" transform="translate(560 405) scale(0.8)"/><use href="#arbusto" transform="translate(790 410) scale(0.95)"/><use href="#arbusto" transform="translate(990 425) scale(0.85)"/></g>
  <g fill="#FFFFFF"><use href="#arbusto" transform="translate(250 432) scale(0.75)"/><use href="#arbusto" transform="translate(1180 440) scale(0.7)"/><use href="#arbusto" transform="translate(470 412) scale(0.75)"/><use href="#arbusto" transform="translate(680 400) scale(0.8)"/><use href="#arbusto" transform="translate(900 415) scale(0.75)"/></g>
  <g fill="#C23B6E"><use href="#arbusto" transform="translate(430 430) scale(0.5)"/><use href="#arbusto" transform="translate(740 425) scale(0.55)"/><use href="#arbusto" transform="translate(1040 438) scale(0.5)"/></g>

  <!-- green, búnker y bandera -->
  <path d="M420 470 C520 448 760 446 900 462 C980 471 990 500 900 512 C760 530 520 528 430 512 C360 500 360 482 420 470 Z" fill="url(#green)"/>
  <path d="M470 492 C520 482 590 484 610 495 C600 508 520 510 470 502 Z" fill="#F3E6C4"/>
  <ellipse cx="760" cy="486" rx="5" ry="2" fill="#2B3A2B"/>
  <rect x="758" y="420" width="3.5" height="66" fill="#F2F2F2"/>
  <path d="M761.5 420 L800 430 L761.5 440 Z" fill="#E8C33A"/>

  <!-- agua delante del green, con reflejos -->
  <path d="M0 540 C220 520 420 525 620 532 C820 539 1000 528 1200 536 L1200 610 L0 610 Z" fill="url(#agua)"/>
  <g stroke="#BFE3F5" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M120 565 h70"/><path d="M380 578 h110"/><path d="M640 566 h80"/><path d="M880 584 h120"/><path d="M1060 562 h60"/>
  </g>
  <g fill="#E46A9A" opacity="0.35"><ellipse cx="560" cy="552" rx="60" ry="6"/><ellipse cx="800" cy="556" rx="70" ry="6"/></g>

  <!-- orilla de flores entre green y agua -->
  <path d="M0 528 C300 512 760 512 1200 526 L1200 544 L0 544 Z" fill="#356E31"/>
  <g fill="#F7F3EA"><circle cx="330" cy="522" r="8"/><circle cx="352" cy="526" r="7"/><circle cx="1010" cy="526" r="8"/><circle cx="1040" cy="530" r="7"/></g>
  <g fill="#E8C33A"><circle cx="370" cy="528" r="5"/><circle cx="990" cy="530" r="5"/></g>

  <!-- puente de piedra a la izquierda -->
  <g>
    <path d="M90 560 C120 520 240 520 270 560 L270 576 C240 548 120 548 90 576 Z" fill="#B9AE9A"/>
    <path d="M90 560 C120 520 240 520 270 560" fill="none" stroke="#8E8370" stroke-width="4"/>
    <path d="M92 552 C122 512 238 512 268 552" fill="none" stroke="#D7CDB8" stroke-width="5"/>
    <path d="M110 576 C140 600 220 600 250 576" fill="none" stroke="#9AC2D8" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- primer plano: antegreen con cortes de siega -->
  <path d="M0 610 C300 596 900 596 1200 610 L1200 700 L0 700 Z" fill="url(#primerPlano)"/>
  <g fill="#5BAA48" opacity="0.5">
    <path d="M0 640 L1200 630 L1200 650 L0 662 Z"/><path d="M0 682 L1200 670 L1200 690 L0 700 Z"/>
  </g>
</svg>
