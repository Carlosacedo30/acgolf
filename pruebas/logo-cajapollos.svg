  <text font-family="'Barlow', Arial, sans-serif" font-weight="800" font-size="27" letter-spacing="9" fill="#4FD1E8" text-anchor="middle"><textPath href="#cpArcBot" startOffset="50%">GOLF · SEVILLA</textPath></text>
