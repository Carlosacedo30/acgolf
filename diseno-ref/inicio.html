body>*:not(.foto){position:relative;z-index:1}
.st{flex:0 0 40px;display:flex;justify-content:space-between;align-items:center;padding:0 8px;font:700 13px Archivo,system-ui,Arial,sans-serif;color:#F4F1E8;opacity:.8}
.hero{flex:1 1 0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding-bottom:14px}
.esc{width:70px;height:70px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 3px #0A0C10,0 0 0 4px #E9CF8C,0 6px 18px rgba(0,0,0,.4)}
.esc svg{display:block;width:100%;height:100%}
.hero h1{margin:0;font:800 30px/1 Archivo,system-ui,Arial,sans-serif;letter-spacing:.1em;margin-right:-.1em;text-transform:uppercase;text-shadow:0 1px 10px rgba(0,0,0,.6);white-space:nowrap}
.cta{flex:0 0 62px;border-radius:999px;background:linear-gradient(180deg,#B3262E,#8A1A21);display:flex;align-items:center;justify-content:center;font:800 19px Archivo,system-ui,Arial,sans-serif;letter-spacing:.12em;color:#fff;box-shadow:0 6px 18px rgba(179,38,46,.2)}
.oro{flex:0 0 52px;margin-top:10px;border-radius:999px;background:linear-gradient(180deg,#EBD08A,#C9A54A);color:#16120A;display:flex;align-items:center;justify-content:center;font:700 18px Archivo,system-ui,Arial,sans-serif;letter-spacing:.01em}
.sec{flex:0 0 auto;font:700 12px/1 Archivo,system-ui,Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#B5BFD0;margin:22px 2px 9px;display:flex;align-items:center;gap:12px}
.sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(217,190,122,.35),transparent)}
.al{flex:0 0 auto;border-radius:18px;background:linear-gradient(160deg,#4A1A20,#2A0C10);border:1px solid rgba(179,38,46,.8);padding:13px 16px;display:flex;align-items:center;gap:14px}
.al .ic{flex:0 0 38px;height:38px;border-radius:50%;border:1.5px solid #D8333D;color:#F4F1E8;display:flex;align-items:center;justify-content:center;font:700 21px/1 Archivo,system-ui,Arial,sans-serif}
.al .tx{flex:1;min-width:0}
.al b{display:block;font:700 18px/1.15 Archivo,system-ui,Arial,sans-serif}
.al span{display:block;font:600 16px/1.25 Barlow,system-ui,Arial,sans-serif;color:#E8C9CC;margin-top:3px}
.c{flex:0 0 auto;width:10px;height:10px;border-right:1.5px solid #E9CF8C;border-top:1.5px solid #E9CF8C;transform:rotate(45deg);margin-right:4px}
.card{flex:0 0 auto;border-radius:18px;background:linear-gradient(160deg,#17233D,#0F1626);border:1px solid rgba(217,190,122,.45)}
.px{padding:16px 18px 18px}
.k{font:700 12px/1 Archivo,system-ui,Arial,sans-serif;letter-spacing:.2em;color:#E9CF8C;text-transform:uppercase}
.px .t{font:italic 600 30px/1.1 'Playfair Display',Georgia,serif;color:#E9CF8C;margin-top:9px}
.px .s{font:600 17px/1.2 Barlow,system-ui,Arial,sans-serif;color:#B5BFD0;margin-top:6px}
.px .s i{font-style:normal;color:#F4F1E8}
.px .btn{height:50px;margin-top:14px;border-radius:999px;border:1px solid #C9A54A;background:linear-gradient(180deg,#EBD08A,#C9A54A);color:#16120A;display:flex;align-items:center;justify-content:center;font:800 18px Archivo,system-ui,Arial,sans-serif;letter-spacing:.02em}
.lg{padding:13px 18px;display:flex;align-items:center;gap:14px}
.lg .tx{flex:1;min-width:0}
.lg b{display:block;font:700 20px/1.1 Archivo,system-ui,Arial,sans-serif}
.lg span{display:block;font:600 17px/1.2 Barlow,system-ui,Arial,sans-serif;color:#B5BFD0;margin-top:4px}
.med{flex:0 0 auto;font:italic 600 34px/1 'Playfair Display',Georgia,serif;color:#E9CF8C;padding-left:16px;border-left:1px solid rgba(217,190,122,.45);height:44px;display:flex;align-items:center}
.nav{flex:0 0 62px;margin:18px 0 12px;border-radius:999px;background:#121620;border:1px solid #242B38;display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;align-items:center;padding:0 7px;font:700 14px/1 Archivo,system-ui,Arial,sans-serif;color:#B5BFD0;text-transform:uppercase;letter-spacing:.06em}
.nav span{position:relative;height:46px;padding:0 12px;display:flex;align-items:center;justify-content:center;border-radius:999px;white-space:nowrap}
.nav .on{color:#16120A;background:linear-gradient(180deg,#EBD08A,#C9A54A);padding:0 20px;font-weight:800}
.dot{position:absolute;top:-1px;right:1px;width:12px;height:12px;border-radius:50%;background:#D8333D;border:2px solid #121620}
@media (max-height:700px){
.st{flex-basis:22px}
.hero{gap:7px;padding-bottom:9px}
.esc{width:40px;height:40px;box-shadow:0 0 0 2px #0A0C10,0 0 0 3px #E9CF8C}
.cta{flex-basis:52px;font-size:18px}
.oro{flex-basis:46px;margin-top:7px;font-size:17px}
.sec{margin:11px 2px 6px}
.al{padding:7px 14px;gap:12px;border-radius:16px}
.al .ic{flex-basis:32px;height:32px;font-size:18px}
.al b{font-size:17px}.al span{font-size:15px;margin-top:1px}
.card{border-radius:16px}
.px{padding:10px 16px 11px}
.px .t{font-size:25px;margin-top:5px}
.px .s{font-size:16px;margin-top:3px}
.px .btn{height:42px;margin-top:8px;font-size:17px}
.lg{padding:8px 16px}
.lg b{font-size:18px}.lg span{font-size:16px;margin-top:2px}
.med{font-size:28px;height:36px;padding-left:14px}
.nav{flex-basis:52px;margin:10px 0 8px;padding:0 5px}
.nav span{height:40px;padding:0 10px}.nav .on{padding:0 16px}
}
